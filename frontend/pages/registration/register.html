<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="{{ url_for('frontend', path='pages/registration/register.css') }}" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@latest/bundles/datastar.js">
    </script>
</head>

<body>
    {% include 'event_loader.html' %}
    <div class="login-card" 
        data-init="@get('/event-system')" 
        data-signals="{isStudent:false}"
        data-computed:is-student="!$_isTrainer"
        >

        <h1>Sign Up</h1>

        <form data-on:submit="@post('/auth/sign-up')">

            <input type="text" data-bind:username placeholder="Username:" required>

            <input type="text" data-bind:display-name placeholder="Display name:" required>
            
            <input type="email" data-bind:email placeholder="Email:" required>
            
            <input type="password" data-bind:password placeholder="Password:" required>
            
            <input type="text" data-bind:country placeholder="Country:">
            
            <input type="text" data-bind:city placeholder="City:">
            
            <label class="checkbox">
                <input type="checkbox" data-bind="_isTrainer">
                <span>I am a trainer</span>
            </label>
            
            <input 
            type="hidden"
            data-computed:avatar-img-src="'https://ui-avatars.com/api/?name=' +
                $displayName.split(' ').join('+') +
                '&background=' +
                Math.floor(Math.random() * 0x444444).toString(16).padStart(6, '0') +
                '&color=f0f6fc&size=80'"
            >
            <button>Create Account</button>

        </form>
        <div class="info-box" data-show="$infoMsg" data-text="$infoMsg" style="display: none">
        </div>
        <div class="success-box" data-show="$successMsg" data-text="$successMsg" style="display: none">
        </div>
        <div class="error-box" data-show="$errorMsg" data-text="$errorMsg" style="display: none">
        </div>
    </div>

</body>

</html>
