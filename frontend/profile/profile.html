<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link href="{{ url_for('frontend', path='profile/profile.css') }}" rel="stylesheet">

    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@latest/bundles/datastar.js"></script>
</head>

<body>

    <div class="settings-layout" data-signals="
        {
            username: '{{ username }}' ? '{{ username }}' : '', 
            displayName: '{{ display_name }}' ? '{{ display_name }}' : '', 
            email: '{{ email }}' ? '{{ email }}' : '',
            country: '{{ country }}' ? '{{ country }}' : '',
            city: '{{ city }}' ? '{{ city }}' : '',
        }"
    >


        <!-- Navigation -->

        {% include 'profile/side_navbar.html' %}



        <!-- Content -->

        <main class="settings-content">


            <header class="content-header">

                <div>

                    <h1>Public profile</h1>

                    <p>
                        Manage the information other users see.
                    </p>

                </div>

            </header>



            <!-- existing profile sections -->

            <section class="panel">

                <div class="panel-title">

                    <h2>Account</h2>

                    <p>
                        Your basic account information.
                    </p>

                </div>


                <div class="form">


                    <div class="field">

                        <label>
                            Avatar
                        </label>


                        <div class="avatar-edit">

                            <img src="https://i.pravatar.cc/100" class="avatar small">

                            <button class="btn secondary">
                                Change photo
                            </button>

                        </div>

                    </div>



                    <div class="field">

                        <label>
                            Username
                        </label>

                        <input data-bind:username> <!--This element's value will get updated when signal gets updated (backend updates it), and signal will also get updated when this value gets updated (frontend updates it - user updates it manually)-->

                    </div>



                    <div class="field">

                        <label>
                            Display name
                        </label>

                        <input data-bind:display-name>

                    </div>


                    <div class="field">

                        <label>
                            Email
                        </label>

                        <input data-bind:email>

                    </div>


                </div>

            </section>




            <section class="panel">

                <div class="panel-title">

                    <h2>Personal</h2>

                    <p>
                        Used for localization and communication.
                    </p>

                </div>


                <div class="form">


                    <div class="field">

                        <label>
                            Country
                        </label>

                        <input data-bind:country>

                    </div>


                    <div class="field">

                        <label>
                            City
                        </label data-bind:city>

                        <input>

                    </div>


                    <div class="field">

                        <label>
                            Timezone
                        </label>

                        <select>

                            <option>
                                Europe/Zagreb
                            </option>

                        </select>

                    </div>


                </div>


            </section>



            <section class="panel">


                <div class="panel-title">

                    <h2>About</h2>

                    <p>
                        Tell others something about yourself.
                    </p>

                </div>


                <div class="form">


                    <div class="field textarea-field">

                        <label>
                            Bio
                        </label>

                        <textarea>
Backend developer and fitness enthusiast.
                    </textarea>

                    </div>


                </div>


            </section>



            <footer>

                <button class="btn secondary">
                    Cancel
                </button>


                <button class="btn primary" data-on:click="@patch('/settings/profile')">
                    Update profile
                </button>

            </footer>



        </main>


    </div>

</body>

</html>
